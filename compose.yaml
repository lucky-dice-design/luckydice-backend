name: luckydice
services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U directus -d directus]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]
  luckydice-cms:
    image: directus/directus:12.3.1
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SECRET: ${DIRECTUS_SECRET}
      LICENSE_KEY: ${LICENSE_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_URL: https://admin.luckydicedesign.de
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TELEMETRY: 'false'
      SESSION_COOKIE_SECURE: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'true'
      RATE_LIMITER_ENABLED: 'true'
    volumes:
      - uploads:/directus/uploads
      - ./setup.mjs:/opt/lucky/setup.mjs:ro
      - ./schema.json:/opt/lucky/schema.json:ro
      - ./seed.json:/opt/lucky/seed.json:ro
      - ./secrets:/opt/lucky/secrets
    networks:
      private:
      web:
        aliases: [luckydice-directus]
  website:
    image: node:22-alpine
    restart: unless-stopped
    user: '1000:1000'
    command: [node, /app/server.mjs]
    environment:
      DIRECTUS_URL: http://luckydice-directus:8055
    volumes:
      - ./server.mjs:/app/server.mjs:ro
      - ../frontend/dist:/app/site:ro
      - ./secrets/contact_token:/app/contact_token:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      web:
        aliases: [luckydice-website]
    depends_on: [luckydice-cms]
networks:
  private:
    internal: true
  web:
    external: true
    name: himmelsteil-cms_web
volumes:
  database:
  uploads:
